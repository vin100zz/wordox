<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wordox - Jeu de Lettres</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header avec bouton quitter -->
        <header class="main-header">
            <h1>WORDOX</h1>
            <button id="newGameBtn" class="btn btn-quit"><span class="btn-icon">✕</span> Quitter</button>
        </header>

        <!-- Scores des joueurs -->
        <div class="scores-panel">
            <div class="score-card player-1">
                <div class="score-value">0</div>
                <div class="score-frozen">0</div>
            </div>
            <div class="score-card player-2">
                <div class="score-value">0</div>
                <div class="score-frozen">0</div>
            </div>
            <div class="score-card player-3">
                <div class="score-value">0</div>
                <div class="score-frozen">0</div>
            </div>
            <div class="score-card player-4">
                <div class="score-value">0</div>
                <div class="score-frozen">0</div>
            </div>
        </div>

        <!-- Bande de messages -->
        <div class="message-bar">
            <div id="gameMessage">Tour du Joueur 1 (Bleu)</div>
            <div id="remainingTiles">Lettres: 102</div>
        </div>

        <!-- Plateau de jeu -->
        <div class="game-board">
            <div id="board"></div>
        </div>

        <!-- Chevalet -->
        <div class="rack-container">
            <div id="rack" class="rack"></div>
        </div>

        <!-- Boutons d'action -->
        <div class="controls">
            <button id="validateBtn" class="btn btn-validate"><span class="btn-icon">✓</span> Valider</button>
            <button id="passBtn" class="btn btn-pass"><span class="btn-icon">››</span> Passer</button>
            <button id="cancelBtn" class="btn btn-cancel"><span class="btn-icon">⟲</span> Annuler</button>
        </div>
    </div>

    <div id="gameOverModal" class="modal">
        <div class="modal-content">
            <h2>Partie terminée !</h2>
            <div id="finalScores"></div>
            <button id="newGameFromModal" class="btn btn-validate">🎮 Nouvelle Partie</button>
        </div>
    </div>

    <script src="ai.js"></script>
    <script src="game.js"></script>
</body>
</html>
